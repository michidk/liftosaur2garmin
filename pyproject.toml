[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liftosaur2garmin"
version = "0.2.0"
description = "Sync Liftosaur workouts to Garmin Connect with FIT file generation and upload support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Konstantinos Georgiou", email = "delfinas7kostas@gmail.com" }]
keywords = ["liftosaur", "garmin", "fitness", "workout", "sync", "fit-file", "strength-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fit-tool>=0.9.15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "httpx>=0.27"]
cloud = ["psycopg2-binary>=2.9"]

[project.scripts]
liftosaur2garmin = "liftosaur2garmin.cli:main"

[project.urls]
Homepage = "https://github.com/drkostas/liftosaur2garmin"
Repository = "https://github.com/drkostas/liftosaur2garmin"

[tool.hatch.build.targets.wheel]
packages = ["src/liftosaur2garmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # Line too long - pre-existing patterns in test mocks and long strings
