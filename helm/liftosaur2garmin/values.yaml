# liftosaur2garmin uses an in-process sync lock and an in-memory autosync timer.
# Running more than one replica can duplicate sync work and is not supported.
replicaCount: 1

image:
  repository: ghcr.io/michidk/liftosaur2garmin
  # Defaults to latest per the project's deployment convention. Pin an immutable
  # release tag or digest for reproducible production deployments.
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# uid/gid 1000 matches the "app" user created in the Dockerfile
# (groupadd/useradd --uid/--gid 1000, home dir /home/app).
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8123

ingress:
  enabled: false
  className: public
  annotations: {}
  # Example:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-production
  hosts: []
  # Example:
  # hosts:
  #   - host: liftosaur2garmin.k8s.lohr.dev
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  # The target cluster's nginx wildcard certificate normally makes tls entries
  # unnecessary. For an explicit or non-wildcard certificate, use for example:
  # tls:
  #   - secretName: liftosaur2garmin-tls
  #     hosts:
  #       - liftosaur2garmin.example.com

# Kubernetes treats HTTP status codes from 200 through 399 as successful probes,
# so GET / remains healthy when password auth redirects the request to /login.
probes:
  liveness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Keep empty by default so operators can choose resource settings appropriate to
# their cluster. Example:
# resources:
#   requests:
#     cpu: 50m
#     memory: 128Mi
#   limits:
#     cpu: 500m
#     memory: 512Mi
resources: {}

# Set create=true to let Helm create a Secret from data below, or leave create
# false and set existingSecret to a Secret managed out-of-band. Never commit real
# credentials to a values file.
secret:
  create: false
  existingSecret: ""
  data: {}
  # Supported keys:
  # LIFTOSAUR_API_KEY: ""
  # GARMIN_EMAIL: ""
  # GARMIN_PASSWORD: ""  # Optional; token-based login is preferred.
  # DATABASE_URL: ""     # Recommended on Kubernetes for stateless operation.
  # L2G_PASSWORD: ""     # Optional; enables dashboard password authentication.

# Empty values are omitted from the generated ConfigMap.
config:
  GARMIN_AUTH_WORKER_BASE_URL: ""
  LIFTOSAUR_API_BASE_URL: ""

# Persistence is unnecessary and disabled when DATABASE_URL is configured.
# When enabled, one PVC is mounted at /home/app (the "app" user's home dir),
# covering both /home/app/.liftosaur2garmin and /home/app/.garminconnect.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
